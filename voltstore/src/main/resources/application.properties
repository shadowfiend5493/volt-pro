spring.application.name=voltstore

logging.pattern.console=%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n

# H2 local in-memory database settings kept for reference.
# spring.h2.console.enabled=true
# spring.datasource.url=jdbc:h2:mem:testdb
# spring.datasource.username=sa
# spring.datasource.password=
# spring.datasource.driver-class-name=org.h2.Driver

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3307}/${DATABASE_NAME:voltstore}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_URL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}

# JWT settings. Override JWT_SECRET in real environments instead of relying on the default.
app.security.jwt.secret=${JWT_SECRET:jxgEQeXHuPq8VdbyYFNkANdudQ53YUn4}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Actuator exposes lightweight application status endpoints for local monitoring.
management.endpoints.access.default=none
management.endpoints.web.exposure.include=*
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.info.env.enabled=true
management.endpoint.health.show-details=always
# management.endpoints.web.base-path=/v1/voltstore
info.app.name=VoltPro Store API
info.app.description=Spring Boot backend for the VoltPro platform

# OpenAPI and Swagger UI documentation.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html